server {
    listen 80;
    server_name e.meta-wit.top;

    # 80 端口强制跳转到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name e.meta-wit.top;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Logto .well-known 端点（需要在 /api/ 之前匹配）
    # 这些端点应该由 Logto 处理，而不是后端 API
    location /api/.well-known/ {
        # 将 /api/.well-known/ 重写为 /.well-known/
        rewrite ^/api/.well-known/(.*)$ /.well-known/$1 break;
        proxy_pass http://logto:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Logto 静态资源（JavaScript、CSS 等）代理 - 必须在 location / 之前匹配
    # 匹配 Logto 的静态资源路径，如 index.xxx.js, index.xxx.css 等
    # 哈希值通常是 8 位小写字母和数字的组合，如 84fba2ba, f9961ad8
    location ~ ^/index\.[a-f0-9]{8,}\.(js|css|mjs)$ {
        proxy_pass http://logto:3010$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 不要压缩响应，确保 Content-Type 正确传递
        proxy_set_header Accept-Encoding "";
    }
    
    # Logto 其他可能的静态资源路径（如 assets/ 等）
    location ~ ^/(assets|static|_next)/ {
        proxy_pass http://logto:3010$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 后端（Nest API）——假设跑在宿主机的 3001 端口
    location /api/ {
        # 同样通过 Docker 网关访问宿主机上的 Nest 服务
        proxy_pass http://172.17.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 前端（Nuxt）——假设跑在宿主机的 3000 端口（必须放在最后，作为默认规则）
    location / {
        # 在 Linux 上，nginx 容器通过 Docker 网关访问宿主机服务
        proxy_pass http://172.17.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Logto OIDC 端点 - /unknown-session 路径（需要在 /admin/ 之前匹配）
    location /unknown-session {
        proxy_pass http://logto:3010/unknown-session;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 处理 WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 重写响应头中的 Location 重定向
        proxy_redirect http://logto:3010/ https://$host/;
        proxy_redirect http://localhost:3010/ https://$host/;
        proxy_redirect http://127.0.0.1:3010/ https://$host/;
        proxy_redirect http://$host:3010/ https://$host/;
        # 重写响应体中的 URL（包括静态资源路径和 API 路径）
        # 修复 JavaScript 模块路径，确保指向正确的 Logto 服务
        sub_filter 'http://$host:3010' 'https://$host';
        sub_filter 'http://localhost:3010' 'https://$host';
        sub_filter 'http://127.0.0.1:3010' 'https://$host';
        sub_filter 'http://e.meta-wit.top:3010' 'https://$host';
        sub_filter 'http://logto:3010' 'https://$host';
        # 修复 API 路径（.well-known 端点）
        sub_filter '/api/.well-known' '/api/.well-known';
        sub_filter_once off;
        sub_filter_types text/javascript application/javascript;
    }

    # Logto 服务代理 - /oidc/ 路径（Logto SDK 默认使用此路径）
    location /oidc/ {
        proxy_pass http://logto:3010/oidc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 处理 WebSocket（如果 Logto 需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 重写响应头中的 Location 重定向
        proxy_redirect http://logto:3010/ https://$host/;
        proxy_redirect http://$host:3010/ https://$host/;
        proxy_redirect http://localhost:3010/ https://$host/;
        # 重写响应体中的 URL（用于 openid-configuration 等 JSON 响应）
        sub_filter 'http://$host:3010' 'https://$host';
        sub_filter 'http://localhost:3010' 'https://$host';
        sub_filter 'http://e.meta-wit.top:3010' 'https://$host';
        sub_filter 'http://logto:3010' 'https://$host';
        sub_filter_once off;
        sub_filter_types application/json application/jwt text/javascript application/javascript;
    }

    # Logto 服务代理 - /logto/ 路径（备用）
    location /logto/ {
        proxy_pass http://logto:3010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 处理 WebSocket（如果 Logto 需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 重写响应头中的 Location 重定向（关键：处理所有可能的 localhost 重定向）
        proxy_redirect http://logto:3010/ https://$host/logto/;
        proxy_redirect http://localhost:3010/ https://$host/logto/;
        proxy_redirect http://127.0.0.1:3010/ https://$host/logto/;
        proxy_redirect http://$host:3010/ https://$host/logto/;
        # unknown-session 应该重定向到根路径
        proxy_redirect http://logto:3010/unknown-session https://$host/unknown-session;
        proxy_redirect http://localhost:3010/unknown-session https://$host/unknown-session;
        proxy_redirect http://127.0.0.1:3010/unknown-session https://$host/unknown-session;
        proxy_redirect http://$host:3010/unknown-session https://$host/unknown-session;
        # 重写响应体中的 URL（用于 openid-configuration 等）
        sub_filter 'http://$host:3010' 'https://$host/logto';
        sub_filter 'http://localhost:3010' 'https://$host/logto';
        sub_filter 'http://127.0.0.1:3010' 'https://$host/logto';
        sub_filter 'http://logto:3010' 'https://$host/logto';
        sub_filter_once off;
        sub_filter_types application/json;
    }

    # Logto 管理控制台代理 - /admin/ 路径
    location /admin/ {
        proxy_pass http://logto:3011/;
        # 关键：正确设置代理头部，让 Logto 知道真实的请求信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;  # 固定为 443（HTTPS 端口）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 处理 WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 重写响应头中的 Location 重定向
        # 管理控制台（3011）的重定向保留在 /admin/ 路径
        proxy_redirect http://logto:3011/ https://$host/admin/;
        proxy_redirect http://localhost:3011/ https://$host/admin/;
        proxy_redirect http://127.0.0.1:3011/ https://$host/admin/;
        proxy_redirect http://$host:3011/ https://$host/admin/;
        # 从管理控制台重定向到 OIDC 服务（3010）的处理
        # unknown-session 应该重定向到根路径，由根路径的 location 规则处理
        proxy_redirect http://logto:3010/unknown-session https://$host/unknown-session;
        proxy_redirect http://localhost:3010/unknown-session https://$host/unknown-session;
        proxy_redirect http://127.0.0.1:3010/unknown-session https://$host/unknown-session;
        proxy_redirect http://$host:3010/unknown-session https://$host/unknown-session;
        # OIDC 路径
        proxy_redirect http://logto:3010/oidc/ https://$host/oidc/;
        proxy_redirect http://localhost:3010/oidc/ https://$host/oidc/;
        proxy_redirect http://127.0.0.1:3010/oidc/ https://$host/oidc/;
        proxy_redirect http://$host:3010/oidc/ https://$host/oidc/;
        # 重写响应体中的静态资源路径（JavaScript 等）
        sub_filter 'http://localhost:3010' 'https://$host';
        sub_filter 'http://127.0.0.1:3010' 'https://$host';
        sub_filter 'http://$host:3010' 'https://$host';
        sub_filter 'http://logto:3010' 'https://$host';
        sub_filter_once off;
        sub_filter_types text/javascript application/javascript;
    }
}


