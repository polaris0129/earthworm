server {
    listen 80;
    server_name e.meta-wit.top;

    # 80 端口强制跳转到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name e.meta-wit.top;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 前端（Nuxt）——假设跑在宿主机的 3000 端口
    location / {
        # 在 Linux 上，nginx 容器通过 Docker 网关访问宿主机服务
        proxy_pass http://172.17.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 后端（Nest API）——假设跑在宿主机的 3001 端口
    location /api/ {
        # 同样通过 Docker 网关访问宿主机上的 Nest 服务
        proxy_pass http://172.17.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Logto 服务代理——通过 HTTPS 访问，解决 mixed content 问题
    location /logto/ {
        proxy_pass http://logto:3010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # 处理 WebSocket（如果 Logto 需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 重写响应中的 URL，将内部地址替换为外部地址
        proxy_redirect http://logto:3010/ https://$host/logto/;
        proxy_redirect http://$host:3010/ https://$host/logto/;
        # 重写响应体中的 URL（用于 openid-configuration 等）
        sub_filter 'http://$host:3010' 'https://$host/logto';
        sub_filter 'http://localhost:3010' 'https://$host/logto';
        sub_filter_once off;
        sub_filter_types application/json text/html;
    }
}


