server {
    listen 80;
    server_name e.meta-wit.top;

    # 80 端口强制跳转到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name e.meta-wit.top;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Logto API 接口（全部 /api/** 都留给 Logto 服务）
    # Logto 可能使用 /api/.well-known/、/api/xxx 等多种接口
    location /api/ {
        proxy_pass http://logto:3010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 后端（Nest API）——使用 /backend/ 前缀
    location /backend/ {
        proxy_pass http://172.17.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 前端（Nuxt）——假设跑在宿主机的 3000 端口（必须放在最后，作为默认规则）
    # 包括所有静态资源，Nuxt 会正确处理
    location / {
        proxy_pass http://172.17.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket 支持（Nuxt/Vite 开发服务器需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        # 缓冲设置，确保静态资源正确传递
        proxy_buffering off;
        # 确保请求 URI 正确传递（不重写路径）
        proxy_redirect off;
    }

    # Logto OIDC 端点（用户认证，端口 3010）
    # 注意：对外暴露为 /logto/oidc/，与 ENDPOINT=https://e.meta-wit.top/logto 保持一致
    location /logto/oidc/ {
        proxy_pass http://logto:3010/oidc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Logto 用户界面（登录 / 注册页面，端口 3010）
    # 统一使用 /logto 前缀对外暴露
    # 先匹配静态资源，确保 JavaScript/CSS 等文件正确加载
    location ~ ^/logto/(.*\.(js|css|mjs|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|map))$ {
        proxy_pass http://logto:3010/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /logto/ {
        proxy_pass http://logto:3010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Logto unknown-session 页面（会话失效时的提示页，端口 3010）
    location /unknown-session {
        proxy_pass http://logto:3010/unknown-session;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Logto 管理控制台（端口 3011）
    # 对外前缀为 /ladmin，与 ADMIN_ENDPOINT=https://e.meta-wit.top/ladmin 对齐
    # 先匹配静态资源，确保 JavaScript/CSS 等文件正确加载
    location ~ ^/ladmin/(.*\.(js|css|mjs|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|map))$ {
        proxy_pass http://logto:3011/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /ladmin/ {
        proxy_pass http://logto:3011/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

