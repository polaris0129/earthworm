server {
    listen 80;
    server_name e.meta-wit.top;

    # 80 端口强制跳转到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name e.meta-wit.top;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Logto API 接口（全部 /api/** 都留给 Logto 服务）
    # Logto 可能使用 /api/.well-known/、/api/xxx 等多种接口
    location /api/ {
        proxy_pass http://logto:3010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 后端（Nest API）——使用 /backend/ 前缀
    location /backend/ {
        proxy_pass http://172.17.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 静态资源：先尝试从 Logto 加载，如果不存在则 fallback 到 Nuxt
    # 匹配常见的静态资源文件扩展名
    location ~ \.(js|css|mjs|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|map)$ {
        # 先尝试从 Logto 加载
        proxy_pass http://logto:3010$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # 如果 Logto 返回 404，则 fallback 到 Nuxt
        proxy_intercept_errors on;
        error_page 404 = @fallback_to_nuxt;
    }

    # Fallback 到 Nuxt（当 Logto 返回 404 时）
    location @fallback_to_nuxt {
        proxy_pass http://172.17.0.1:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 前端（Nuxt）——假设跑在宿主机的 3000 端口（必须放在最后，作为默认规则）
    location / {
        proxy_pass http://172.17.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Logto OIDC 端点（用户认证，端口 3010）
    location /oidc/ {
        proxy_pass http://logto:3010/oidc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Logto 用户界面（登录 / 注册页面，端口 3010）
    location /logto/ {
        proxy_pass http://logto:3010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Logto unknown-session 页面（会话失效时的提示页，端口 3010）
    location /unknown-session {
        proxy_pass http://logto:3010/unknown-session;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Logto 管理控制台（端口 3011）
    location /admin/ {
        proxy_pass http://logto:3011/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

